<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),R=Math.random,HW=2.59,LN=13.4,NZ=6.7,NH=1.524,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

addEventListener('resize',rs);rs();
const pj=(x,y,z)=>{const s=S*1.05/(z-cam.z);return{x:W/2+(x-cam.x)*s,y:H*.3+(cam.y-y)*s,s}};
const RK=['Perunggu III','Perunggu II','Perunggu I','Perak III','Perak II','Perak I','Emas III','Emas II','Emas I','Platinum III','Platinum II','Platinum I','Diamond III','Diamond II','Diamond I','LEGENDA'];
const NM=['Rian','Dimas','Kevin','Anthony','Jonatan','Viktor','Chen','Taufik','Sindu','Marcus'],DN=['Mudah','Sedang','Sulit'];
let cr={rp:0};try{cr=JSON.parse(localStorage.getItem('sc_cr'))||cr}catch(e){}
const saveCr=()=>{try{localStorage.setItem('sc_cr',JSON.stringify(cr))}catch(e){}},rk=()=>Math.min(15,cr.rp/50|0);
let G=null,SH={x:0,y:1,z:0,vx:0,vy:0,vz:0,live:0,last:0,svc:0,tr:[],pz:0},A=[],me,bot,time=0,IN={x:0,z:0},hr=0,jr=0,keys={},TCh=null,sd=1,sf=0,hb=0,jb=0;
const crowd=Array.from({length:260},()=>({u:R(),v:R(),c:['#e94560','#f5c542','#4fc3f7','#9ccc65','#ba68c8','#ffffff'][R()*6|0]}));
let ac;function snd(f,d,ty,v){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain();o.type=ty||'square';o.frequency.value=f;n.gain.value=v||.07;n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- UI ---------- */
function ui(h){const u=$('ui');if(!h){u.style.display='none';return}u.style.display='flex';u.innerHTML='<div class="box">'+h+'</div>'}
/* ---------- Juice (screen shake trauma + hit pause + slow-mo) ---------- */
const nz=(t,k)=>Math.sin(t*12.9+k)*.5+Math.sin(t*7.3+k*2.1)*.3+Math.sin(t*19.7+k*.7)*.2;
const Juice={trauma:0,_p:0,_s:0,_ss:1,ts:1,_t:0,shake(a){this.trauma=Math.min(1,this.trauma+a)},hitPause(ms){this._p=Math.max(this._p,ms/1000)},slowmo(sc,ms){this._ss=sc;this._s=ms/1000},smash(){this.hitPause(85);this.shake(.75)},
 update(d){d=Math.min(d,.05);this._t+=d;this.trauma=Math.max(0,this.trauma-1.6*d);if(this._s>0){this._s-=d;this.ts=this._s>0?this._ss:1}if(this._p>0){this._p-=d;return 0}return d*this.ts},
 apply(c,w,h){const s=this.trauma*this.trauma;if(s<.0005)return;const t=this._t;c.translate(w/2,h/2);c.rotate(.035*s*nz(t,1));c.translate(-w/2+18*s*nz(t,7),-h/2+18*s*nz(t,13))}};
/* ---------- Movement berbobot: acceleration, top speed, friction ---------- */
const damp=(a,b,l,dt)=>b+(a-b)*Math.exp(-l*dt);
function mstep(p,mx,mz,dt,top,sc){const ac=top*8.5,tn=top*13;let ix=mx*sc,iz=mz*sc;const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il}
 if(il>.01){const sp=Math.hypot(p.vx,p.vz),dot=sp>.2?(p.vx*ix+p.vz*iz)/(sp*il):1,a=ac+(1-dot)*.5*(tn-ac),d=Math.exp(-.9*dt);p.vx=(p.vx+ix*a*dt)*d;p.vz=(p.vz+iz*a*dt)*d}
 else{const f=Math.exp(-9*dt);p.vx*=f;p.vz*=f;if(Math.hypot(p.vx,p.vz)<.05)p.vx=p.vz=0}
 const mxs=top*Math.max(sc,.0001),s=Math.hypot(p.vx,p.vz);if(s>mxs){const k=Math.max(mxs/s,Math.exp(-14*dt));p.vx*=k;p.vz*=k}}
/* ---------- FSM animasi: IDLE / RUN / PREPARE / SMASH(startup-active-recovery) / RECOVER ---------- */
const SW={su:.05,ac:.22,tot:.44};
function swPh(p){if(p.sw<=0)return null;const e=SW.tot-p.sw;return e<SW.su?'startup':e<SW.su+SW.ac?'active':'recovery'}
function animP(p,dt){const sp=Math.hypot(p.vx,p.vz),ph=swPh(p),th=SH.live&&SH.last!=p.id&&(p.dir>0?SH.z<NZ+.5:SH.z>NZ-.5)&&Math.hypot(SH.x-p.x,SH.z-p.z)<3.2;
 p.st=ph?'SMASH':p.cd>0?'RECOVER':th?'PREPARE':sp>.5?'RUN':'IDLE';
 p.mvs=p.st=='SMASH'?(ph=='startup'?.6:ph=='active'?.35:.4):p.st=='RECOVER'?.6:p.st=='PREPARE'?.9:1;
 const T=p.st=='SMASH'?(ph=='startup'?[1.08,.9]:ph=='active'?[.9,1.16]:[1.03,.96]):p.st=='PREPARE'?[1.05,.94]:p.st=='RUN'?[1,1+Math.abs(Math.sin(p.ph))*.05]:p.st=='RECOVER'?[1.02,.97]:[1,1+Math.sin(time*3)*.02];
 p.px=damp(p.px||1,T[0],18,dt);p.py=damp(p.py||1,T[1],18,dt)}
/* ---------- HUD (HTML overlay) ---------- */
const HS={};

 const set=(id,v)=>{if(HS[id]!==v){HS[id]=v;const e=$(id);e.textContent=v;if(id[0]=='s'){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}};
 set('s0',G.sc[0]);set('s1',G.sc[1]);set('g0','G'+G.gm[0]);set('g1','G'+G.gm[1]);set('n0',nick());set('n1',G.cfg.name);set('mid',G.cfg.lab+' · '+G.cfg.to);set('rally',G.rally>3&&G.st=='rally'?'RALLY ×'+G.rally:'');
 $('d0').classList.toggle('on',G.server==0);$('d1').classList.toggle('on',G.server==1);

  if(!need||(o.ny!==null&&o.ny>NH+.08))break;th+=.07}return o}

 s.vx=v.vx;s.vy=v.vy;s.vz=v.vz;s.live=1;s.last=p.id;s.svc=lab=='serve'?1:0;s.sg=-Math.sign(p.x)||1;G.st='rally';G.rally++;G.hn=(G.hn|0)+1;G.hl=lab;G.hi=p.id;p.hit=1;p.cd=.25;if(p.sw<=0)p.sw=SW.tot-SW.su;

function landed(){const s=SH,inb=Math.abs(s.x)<=HW+.03&&s.z>=-.03&&s.z<=LN+.03,side=s.z<NZ?0:1,opp=side!=s.last;let w,m;
 if(s.svc){const ok=opp&&s.x*s.sg>=-.03&&Math.abs(s.x)<=HW+.03&&Math.abs(s.z-NZ)>=1.95&&Math.abs(s.z-NZ)<=NZ+.03;w=ok?s.last:1-s.last;m=ok?'ACE!':'FAULT SERVIS'}

function stepSH(dt){const s=SH;if(!s.live)return;const v=Math.hypot(s.vx,s.vy,s.vz),k=.22*v;s.pz=s.z;s.vx-=k*s.vx*dt;s.vz-=k*s.vz*dt;s.vy-=(9.8+k*s.vy)*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
 if(G.st=='rally'&&G.net!=2&&(s.pz-NZ)*(s.z-NZ)<0&&s.y<NH&&Math.abs(s.x)<3.1){s.vx*=.1;s.vz=-s.vz*.08;s.vy=Math.min(s.vy,0);point(1-s.last,'JARING!')}

function stepP(p,dt,mx,mz,sp,fr){if(!fr)mstep(p,mx,mz,dt,sp,p.mvs==null?1:p.mvs);p.x=clamp(p.x+p.vx*dt,-3,3);p.z=clamp(p.z+p.vz*dt,p.dir>0?.15:NZ+.4,p.dir>0?NZ-.4:LN-.15);
 if(p.y>0||p.vy>0){p.vy-=15*dt;p.y+=p.vy*dt;if(p.y<=0){p.y=0;p.vy=0}}p.ph+=Math.hypot(p.vx,p.vz)*dt*2.4;p.sw=Math.max(0,p.sw-dt);p.cd-=dt;const u=p.sw>0?(SW.tot-p.sw)/SW.tot:0,q0=SW.su/SW.tot,tg=u<q0?-.4*Math.sin(u/q0*1.57):-.4+2.9*(1-Math.pow(1-(u-q0)/(1-q0),3));p.ra=(p.ra||0)+(tg-(p.ra||0))*Math.min(1,dt*(p.sw>0?40:8));p.jr=(p.jr||0)+((p.y>0?.5:0)-(p.jr||0))*Math.min(1,dt*10);animP(p,dt)}
function botAI(dt){const b=bot,s=SH,sk=G.cfg.skill;let mx=0,mz=0,sc=1,tx=0,tz=NZ+3.7;
 if(G.st=='rally'&&s.live&&s.last==0){b.pt-=dt;if(b.pt<=0){b.pt=.05+(1-sk)*.3;const r=simL(s.x,s.y,s.z,s.vx,s.vy,s.vz,1.3),e=(1-sk)*1.4;b.tx=clamp(r.x+(R()-.5)*e,-3,3);b.tz=clamp(r.z+(R()-.5)*e,NZ+.4,LN-.15);b.ol=(Math.abs(r.x)>HW+.12||r.z>LN+.12)&&R()<sk*.9}
  tx=b.tx;tz=b.tz;const dd=Math.hypot(s.x-b.x,s.z-b.z);
  if(!b.ol&&b.sw<=0&&b.cd<=0&&dd<1.55&&s.y<2.7+b.y&&s.y>.25&&R()<dt*(5+sk*20)){b.sw=SW.tot;b.hit=0}
  if(s.y>2.3&&dd<2.6&&b.y==0&&sk>.35&&!b.ol&&R()<dt*6)b.vy=5.4}
 else if(G.st!='rally'||s.last==1)sc=.55;

 if(host){on('sc_hi',m=>{if(m.isMe)return;if(NET.opp&&NET.opp!=m.peer){em('sc_full',{to:m.peer});return}NET.onm=String((m.data&&m.data.n)||'Lawan').slice(0,14);if(!NET.opp){NET.opp=m.peer;em('sc_go',{to:m.peer,n:nick(),cfg:cfgNet()});newNetMatch()}else if(G&&G.net==1&&G.t<8)em('sc_go',{to:m.peer,n:nick(),cfg:cfgNet()})});
  on('sc_in',m=>{if(m.peer!=NET.opp)return;const d=m.data||{};NET.in={x:clamp(+d.x||0,-1,1),z:clamp(+d.z||0,-1,1)};NET.h=d.h|0;NET.j=d.j|0;NET.last=performance.now()})}
 else{on('sc_hi',m=>{if(m.isMe&&m.sameTab)NET.me=m.peer});

const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]},gather=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();const f=()=>{if(pc.iceGatheringState=='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,4500)});
async function pack(o){const t=JSON.stringify({t:o.type,s:o.sdp});try{if(window.CompressionStream){const c=new CompressionStream('deflate-raw'),w=c.writable.getWriter();w.write(new TextEncoder().encode(t));w.close();return'Z'+btoa(String.fromCharCode(...new Uint8Array(await new Response(c.readable).arrayBuffer())))}}catch(e){}return'R'+btoa(unescape(encodeURIComponent(t)))}
async function unpack(c){c=String(c).replace(/\s+/g,'');const b=atob(c.slice(1));let t;if(c[0]=='Z'){const d=new DecompressionStream('deflate-raw'),w=d.writable.getWriter();w.write(Uint8Array.from(b,x=>x.charCodeAt(0)));w.close();t=await new Response(d.readable).text()}else t=decodeURIComponent(escape(b));const j=JSON.parse(t);return{type:j.t,sdp:j.s}}
function mkLink(dc,self,remote){const L={},h={},pl=[],disp=m=>(h[m.topic]||[]).forEach(f=>f(m));dc.onmessage=e=>{try{const d=JSON.parse(e.data);disp({topic:d.t,data:d.d,peer:remote,isMe:false,sameTab:false})}catch(x){}};
 dc.onclose=()=>pl.forEach(f=>f({peers:[],joined:[],updated:[],left:[{peer:remote}]}));
 L.emit=(t,d)=>{try{if(dc.readyState=='open')dc.send(JSON.stringify({t,d}))}catch(x){}disp({topic:t,data:d,peer:self,isMe:true,sameTab:true});return Promise.resolve()};
 L.on=(t,f)=>{(h[t]=h[t]||[]).push(f);return()=>{h[t]=(h[t]||[]).filter(x=>x!==f)}};L.onPeers=f=>{pl.push(f);return()=>{const i=pl.indexOf(f);if(i>=0)pl.splice(i,1)}};
 L.leave=()=>{try{dc.close();L.pc&&L.pc.close()}catch(x){}return Promise.resolve()};return L}

 try{pc=NET.pc=new RTCPeerConnection(ICE);pc.ondatachannel=e=>{const dc=e.channel,go=()=>p2Link(pc,dc,0);dc.readyState=='open'?go():dc.onopen=go};await pc.setRemoteDescription(offer);await pc.setLocalDescription(await pc.createAnswer());await gather(pc);code=await pack(pc.localDescription)}catch(e){return pst('Gagal membuat balasan. Pastikan kode lengkap.')}

function netApply(d){if(!G||G.net!=2||!d||!(d.k>NET.seen))return;NET.seen=d.k;NET.last=performance.now();const o0=G.sc[0],o1=G.sc[1];
 G.st=d.st;G.t=d.t;G.sc=d.sc;G.gm=d.gm;G.server=d.sv;G.rally=d.r;G.nextGame=d.ng;G.msg=d.m;G.mt=d.mt;G.won=d.w<0?null:d.w;if(d.sc[0]>o0){snd(660,.3,'triangle');Juice.shake(.2)}else if(d.sc[1]>o1){snd(200,.3,'triangle');Juice.shake(.1)}
 const ap=(p,a,own)=>{const[x,z,y,vx,vz,vy,sw,cd]=a,far=Math.hypot(x-p.x,z-p.z);if(own){NET.tg={x,z};if(far>1.6){p.x=x;p.z=z}}else{const k=far>1.2?1:.6;p.x+=(x-p.x)*k;p.z+=(z-p.z)*k;p.vx=vx;p.vz=vz;p.y=y;p.vy=vy;if(p.sw<=0&&sw>0)p.sw=sw;p.cd=cd}};ap(me,d.p[0],1);ap(bot,d.p[1],0);
